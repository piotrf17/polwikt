// polwikt corpus schema — the output contract (REQUIREMENTS.md §7).
//
// Audience: applications built on Polish lexical data — a dictionary app, a flashcard
// (Anki) generator. The schema carries what such an app shows or queries: meanings,
// inflection, pronunciation, examples, related words. It deliberately does NOT mirror
// how Wiktionary renders or stores an article: no template calls, no wiki markup or link
// targets, no page ids or revisions, no maintenance categories, no reference lists.
// Those live in the pipeline's internals and debugging tools (`polwikt inspect`), not
// here.
//
// Rules (R7.6, CLAUDE.md):
// - Never renumber or reuse a field number once a corpus has been released; removal
//   means `reserved`.
// - Every enum has `<PREFIX>_UNSPECIFIED = 0`.
// - Repeated messages, not `map<>` fields: a map entry can never gain a field, while a
//   repeated message can (additively). (Not a determinism issue: deterministic=True
//   serialization sorts map entries by key.)
// - Enums only for genuinely closed grammatical sets (R7.7). Open vocabularies — usage
//   labels, dialect names, topics — are plain strings.

syntax = "proto3";

package polwikt;

// ---------------------------------------------------------------------------
// Grammatical categories: the closed Polish sets (R7.7, §6)
// ---------------------------------------------------------------------------

// Word class. Entries under headings outside this set (letters, symbols, punctuation,
// romanizations, ...) are not useful to a learner and are not emitted (counted in
// stats.json).
enum Pos {
  POS_UNSPECIFIED = 0;
  POS_NOUN = 1;
  POS_PROPER_NOUN = 2;
  POS_VERB = 3;
  POS_ADJECTIVE = 4;
  POS_ADVERB = 5;
  POS_PRONOUN = 6;
  POS_NUMERAL = 7;
  POS_DETERMINER = 8;
  POS_PREPOSITION = 9;
  POS_CONJUNCTION = 10;
  POS_PARTICLE = 11;
  POS_INTERJECTION = 12;
  POS_PARTICIPLE = 13;
  POS_PREFIX = 14;
  POS_SUFFIX = 15;
  POS_PHRASE = 16;
  POS_PREPOSITIONAL_PHRASE = 17;
  POS_IDIOM = 18;
  POS_PROVERB = 19;
  POS_ABBREVIATION = 20;  // also initialisms and acronyms
  POS_CONTRACTION = 21;
}

enum Case {
  CASE_UNSPECIFIED = 0;
  CASE_NOMINATIVE = 1;
  CASE_GENITIVE = 2;
  CASE_DATIVE = 3;
  CASE_ACCUSATIVE = 4;
  CASE_INSTRUMENTAL = 5;
  CASE_LOCATIVE = 6;
  CASE_VOCATIVE = 7;
}

enum Number {
  NUMBER_UNSPECIFIED = 0;
  NUMBER_SINGULAR = 1;
  NUMBER_PLURAL = 2;
  NUMBER_DUAL = 3;  // remnant paradigms: ręce, oczy, uszy
}

// Singular forms take masculine/feminine/neuter; plural agreement is virile
// (masculine-personal) vs nonvirile (R6.1, R6.2).
enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MASCULINE = 1;
  GENDER_FEMININE = 2;
  GENDER_NEUTER = 3;
  GENDER_VIRILE = 4;
  GENDER_NONVIRILE = 5;
}

// Masculine subgender (R6.1).
enum Animacy {
  ANIMACY_UNSPECIFIED = 0;
  ANIMACY_PERSONAL = 1;
  ANIMACY_ANIMATE = 2;
  ANIMACY_INANIMATE = 3;
}

enum Person {
  PERSON_UNSPECIFIED = 0;
  PERSON_FIRST = 1;
  PERSON_SECOND = 2;
  PERSON_THIRD = 3;
}

enum Tense {
  TENSE_UNSPECIFIED = 0;
  TENSE_PRESENT = 1;
  TENSE_PAST = 2;
  TENSE_FUTURE = 3;  // perfective simple future and both periphrastic futures
}

enum Mood {
  MOOD_UNSPECIFIED = 0;
  MOOD_INDICATIVE = 1;
  MOOD_IMPERATIVE = 2;
  MOOD_CONDITIONAL = 3;
}

enum Aspect {
  ASPECT_UNSPECIFIED = 0;
  ASPECT_IMPERFECTIVE = 1;
  ASPECT_PERFECTIVE = 2;
  ASPECT_BIASPECTUAL = 3;
}

enum Degree {
  DEGREE_UNSPECIFIED = 0;
  DEGREE_POSITIVE = 1;
  DEGREE_COMPARATIVE = 2;
  DEGREE_SUPERLATIVE = 3;
}

// Non-finite verb forms (R6.2). Finite forms leave this UNSPECIFIED.
enum VerbForm {
  VERB_FORM_UNSPECIFIED = 0;
  VERB_FORM_INFINITIVE = 1;
  VERB_FORM_ACTIVE_ADJECTIVAL_PARTICIPLE = 2;       // -ący
  VERB_FORM_PASSIVE_ADJECTIVAL_PARTICIPLE = 3;      // -ny / -ty
  VERB_FORM_CONTEMPORARY_ADVERBIAL_PARTICIPLE = 4;  // -ąc
  VERB_FORM_ANTERIOR_ADVERBIAL_PARTICIPLE = 5;      // -wszy / -łszy
  VERB_FORM_VERBAL_NOUN = 6;                        // -nie / -cie
  VERB_FORM_IMPERSONAL_PAST = 7;                    // -no / -to
}

// One table cell's grammatical features. Scalar on purpose: a cell covering several
// cases (nom/acc) becomes one Form per case, so a consumer can filter or pivot the
// flat list without unpacking sets (R7.8).
message GrammaticalTags {
  Case grammatical_case = 1;  // `case` is a C++ keyword
  Number number = 2;
  Gender gender = 3;
  Animacy animacy = 4;
  Person person = 5;
  Tense tense = 6;
  Mood mood = 7;
  Aspect aspect = 8;
  Degree degree = 9;
  VerbForm verb_form = 10;
}

// ---------------------------------------------------------------------------
// Entry content
// ---------------------------------------------------------------------------

// One inflected form (R7.8): "kotów" = genitive plural.
message Form {
  string form = 1;
  GrammaticalTags tags = 2;
  repeated string labels = 3;    // usage on this one cell: "archaic", "colloquial"
  repeated string raw_tags = 4;  // grammatical features no enum covers
}

message Sense {
  string gloss = 1;                     // English, plain text
  repeated string labels = 2;           // "colloquial", "obsolete", "Far Masovian" (R6.7)
  repeated Example examples = 3;
  repeated Relation relations = 4;      // synonyms etc. of this sense only
  repeated Government government = 5;  // what it governs: do + genitive (R6.11)
  repeated Sense subsenses = 6;         // R5.4
}

message Example {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_EXAMPLE = 1;      // a usage example sentence
    KIND_QUOTATION = 2;    // from a published text; `source` says which
    KIND_COLLOCATION = 3;  // a short fixed combination (R6.12)
  }
  Kind kind = 1;
  string text = 2;         // Polish
  string translation = 3;  // English
  string literal = 4;      // literal translation, when given
  string source = 5;       // quotations: "Henryk Sienkiewicz, Potop (1886)"
}

// Case/preposition government (R6.11): what a verb, preposition or adjective requires.
message Government {
  string preposition = 1;  // empty when a bare case is governed
  Case grammatical_case = 2;
  string description = 3;  // the slot: "what", "to what", "on what"
}

message Relation {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_SYNONYM = 1;
    TYPE_ANTONYM = 2;
    TYPE_HYPERNYM = 3;
    TYPE_HYPONYM = 4;
    TYPE_COORDINATE = 5;
    TYPE_MERONYM = 6;
    TYPE_HOLONYM = 7;
    TYPE_DERIVED = 8;
    TYPE_RELATED = 9;
    TYPE_ALTERNATIVE_FORM = 10;
    TYPE_HOMOPHONE = 11;
    TYPE_DIMINUTIVE = 12;
    TYPE_AUGMENTATIVE = 13;
    TYPE_ASPECT_PARTNER = 14;  // the other aspect of a verb pair (R3.14)
    TYPE_FREQUENTATIVE = 15;
    TYPE_FEMININE_EQUIVALENT = 16;
    TYPE_MASCULINE_EQUIVALENT = 17;
    TYPE_RELATED_ADJECTIVE = 18;  // kot -> koci
    TYPE_RELATED_ADVERB = 19;     // dobry -> dobrze
    TYPE_PARTICIPLE_OF = 20;      // on a participle entry: its verb (decision 10)
  }
  Type type = 1;
  string term = 2;             // a Polish lemma
  string gloss = 3;            // disambiguating gloss, when given
  repeated string labels = 4;  // "colloquial", "dialectal"
}

message Pronunciation {
  string ipa = 1;
  // Empty for the standard pronunciation; dialect names otherwise (R6.5).
  repeated string labels = 2;
}

message Audio {
  string file = 1;   // Wikimedia Commons file name; the URL is derivable from it
  string label = 2;  // what is spoken, when not the bare lemma: "mieć się"
}

message NounInfo {
  repeated GenderAnimacy genders = 1;  // usually one; variable-gender nouns list each
  bool plurale_tantum = 2;
  bool singulare_tantum = 3;
  bool indeclinable = 4;
}

message GenderAnimacy {
  Gender gender = 1;
  Animacy animacy = 2;
}

message VerbInfo {
  Aspect aspect = 1;  // partners and frequentatives are Relations
}

// ---------------------------------------------------------------------------
// Structure
// ---------------------------------------------------------------------------

// One lexeme: a word class + etymology combination. Homographs are separate entries —
// zamek "castle" and zamek "lock" are two noun entries with their own senses and
// declension (R5.1). Each entry is self-contained: page-level pronunciation is copied
// into every entry it applies to, so one entry is enough to build one flashcard.
message Entry {
  Pos pos = 1;
  repeated Sense senses = 2;
  repeated Form forms = 3;
  repeated Pronunciation pronunciations = 4;
  repeated Audio audio = 5;
  string syllabification = 6;      // hyphenation, when given
  string etymology = 7;            // plain text
  repeated string labels = 8;      // labels on the whole entry (term-level)
  repeated Relation relations = 9;
  repeated Example examples = 10;  // collocations and examples not tied to one sense
  string usage_notes = 11;         // plain text
  repeated string topics = 12;     // topical categories: "Animals", "Music"

  oneof detail {  // matches `pos` where it applies
    NounInfo noun = 13;
    VerbInfo verb = 14;
  }
}

// How common the word is, from a frequency dictionary cited on the page.
message Frequency {
  int32 rank = 1;     // 1 = most common
  int32 count = 2;    // occurrences in the source corpus
  string source = 3;  // "Słownik frekwencyjny polszczyzny współczesnej (1990)"
}

// One Polish lemma (R7.7a). Inflected forms are folded into their lemma's `forms` and
// found through index.sqlite; they are never records of their own.
message Word {
  string lemma = 1;
  repeated Entry entries = 2;
  Frequency frequency = 3;  // unset when the page cites none
}

// Corpus-level metadata, written to corpus.meta.pb beside the shards (R7.4).
message Corpus {
  string schema_version = 1;
  string dump_date = 2;             // the English Wiktionary snapshot, YYYYMMDD
  string pipeline_version = 3;
  int64 word_count = 4;
  repeated string drop_labels = 5;  // what was excluded, e.g. "Middle Polish" (R6.6b)
  string license = 6;               // "CC BY-SA 4.0" (R11.1)
  string attribution = 7;
}
