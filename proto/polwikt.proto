// polwikt corpus schema.
//
// One `Word` per Polish lemma page of the English Wiktionary (R7.7a). See
// REQUIREMENTS.md sections 5-7; the sketch there is illustrative, this file is the
// contract.
//
// Rules that apply throughout (R7.6):
//   * Field numbers are never reused or renumbered. Removal means `reserved`.
//   * Closed grammatical categories are enums; anything unmapped keeps its literal
//     string in a `raw_tags` field. Losing data is worse than an untyped field.
//   * No `map<>` fields anywhere: protobuf map ordering is unspecified, which would
//     break the byte-identical output guarantee (G5). Sorted repeated pairs instead.

syntax = "proto3";

package polwikt;

// ---------------------------------------------------------------------------
// Grammatical categories (R7.7). Closed sets only.
// ---------------------------------------------------------------------------

// English Wiktionary part-of-speech headings (R5.3).
enum Pos {
  POS_UNSPECIFIED = 0;
  POS_NOUN = 1;
  POS_PROPER_NOUN = 2;
  POS_VERB = 3;
  POS_ADJECTIVE = 4;
  POS_ADVERB = 5;
  POS_PRONOUN = 6;
  POS_NUMERAL = 7;
  POS_DETERMINER = 8;
  POS_PREPOSITION = 9;
  POS_POSTPOSITION = 10;
  POS_CONJUNCTION = 11;
  POS_PARTICLE = 12;
  POS_INTERJECTION = 13;
  POS_PREFIX = 14;
  POS_SUFFIX = 15;
  POS_INTERFIX = 16;
  POS_INFIX = 17;
  POS_LETTER = 18;
  POS_SYMBOL = 19;
  POS_PHRASE = 20;
  POS_PROVERB = 21;
  POS_IDIOM = 22;
  POS_ABBREVIATION = 23;
  POS_INITIALISM = 24;
  POS_ACRONYM = 25;
  POS_CONTRACTION = 26;
  POS_PARTICIPLE = 27;
  POS_DIACRITICAL_MARK = 28;
  POS_PUNCTUATION_MARK = 29;
  POS_SYLLABLE = 30;
  POS_ROMANIZATION = 31;
}

// Seven cases (R6.1). Syncretic table cells are emitted as one Form per case, not as a
// combined value.
enum Case {
  CASE_UNSPECIFIED = 0;
  CASE_NOMINATIVE = 1;
  CASE_GENITIVE = 2;
  CASE_DATIVE = 3;
  CASE_ACCUSATIVE = 4;
  CASE_INSTRUMENTAL = 5;
  CASE_LOCATIVE = 6;
  CASE_VOCATIVE = 7;
}

enum Number {
  NUMBER_UNSPECIFIED = 0;
  NUMBER_SINGULAR = 1;
  NUMBER_PLURAL = 2;
  NUMBER_DUAL = 3;  // Middle Polish remnants (oczy, ręce, uszy)
}

// Polish gender is a 3-way singular contrast plus the virile/nonvirile plural
// agreement split (R6.1). Animacy is orthogonal; see Animacy.
enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MASCULINE = 1;
  GENDER_FEMININE = 2;
  GENDER_NEUTER = 3;
  GENDER_VIRILE = 4;     // masculine personal plural agreement
  GENDER_NONVIRILE = 5;  // all other plural agreement
}

// Masculine subgender, which selects the accusative singular (R6.1).
enum Animacy {
  ANIMACY_UNSPECIFIED = 0;
  ANIMACY_PERSONAL = 1;
  ANIMACY_ANIMATE = 2;
  ANIMACY_INANIMATE = 3;
}

enum Person {
  PERSON_UNSPECIFIED = 0;
  PERSON_FIRST = 1;
  PERSON_SECOND = 2;
  PERSON_THIRD = 3;
}

enum Tense {
  TENSE_UNSPECIFIED = 0;
  TENSE_PRESENT = 1;
  TENSE_PAST = 2;
  TENSE_FUTURE = 3;
}

enum Mood {
  MOOD_UNSPECIFIED = 0;
  MOOD_INDICATIVE = 1;
  MOOD_IMPERATIVE = 2;
  MOOD_CONDITIONAL = 3;
}

enum Aspect {
  ASPECT_UNSPECIFIED = 0;
  ASPECT_IMPERFECTIVE = 1;
  ASPECT_PERFECTIVE = 2;
  ASPECT_BIASPECTUAL = 3;
}

enum Voice {
  VOICE_UNSPECIFIED = 0;
  VOICE_ACTIVE = 1;
  VOICE_PASSIVE = 2;
}

enum Degree {
  DEGREE_UNSPECIFIED = 0;
  DEGREE_POSITIVE = 1;
  DEGREE_COMPARATIVE = 2;
  DEGREE_SUPERLATIVE = 3;
}

// Non-finite and impersonal verb forms (R6.2). Polish has two adjectival and two
// adverbial participles, plus a verbal noun and the -no/-to impersonal past.
enum NonFinite {
  NON_FINITE_UNSPECIFIED = 0;
  NON_FINITE_INFINITIVE = 1;
  NON_FINITE_ACTIVE_ADJECTIVAL_PARTICIPLE = 2;
  NON_FINITE_PASSIVE_ADJECTIVAL_PARTICIPLE = 3;
  NON_FINITE_CONTEMPORARY_ADVERBIAL_PARTICIPLE = 4;  // -ąc
  NON_FINITE_ANTERIOR_ADVERBIAL_PARTICIPLE = 5;      // -wszy / -łszy
  NON_FINITE_VERBAL_NOUN = 6;                        // -nie / -cie
  NON_FINITE_IMPERSONAL_PAST = 7;                    // -no / -to
}

// Register, temporal and usage labels from {{lb|pl|...}} (R6.7). Open-ended in
// practice: unmapped labels keep their literal string in a `raw_tags` field.
enum Tag {
  TAG_UNSPECIFIED = 0;
  TAG_COLLOQUIAL = 1;
  TAG_INFORMAL = 2;
  TAG_FORMAL = 3;
  TAG_LITERARY = 4;
  TAG_POETIC = 5;
  TAG_SLANG = 6;
  TAG_VULGAR = 7;
  TAG_OFFENSIVE = 8;
  TAG_DEROGATORY = 9;
  TAG_HUMOROUS = 10;
  TAG_EUPHEMISTIC = 11;
  TAG_IRONIC = 12;
  TAG_ARCHAIC = 13;
  TAG_DATED = 14;
  TAG_OBSOLETE = 15;
  TAG_HISTORICAL = 16;
  TAG_MIDDLE_POLISH = 17;  // drives the R6.6a drop; kept so the decision is auditable
  TAG_DIALECTAL = 18;
  TAG_REGIONAL = 19;
  TAG_RARE = 20;
  TAG_NONSTANDARD = 21;
  TAG_PROSCRIBED = 22;
  TAG_FIGURATIVE = 23;
  TAG_LITERAL = 24;
  TAG_TRANSITIVE = 25;
  TAG_INTRANSITIVE = 26;
  TAG_REFLEXIVE = 27;
  TAG_IMPERSONAL = 28;
  TAG_DEFECTIVE = 29;
  TAG_INDECLINABLE = 30;
  TAG_PLURALE_TANTUM = 31;
  TAG_SINGULARE_TANTUM = 32;
  TAG_DIMINUTIVE = 33;
  TAG_AUGMENTATIVE = 34;
  TAG_COLLECTIVE = 35;
  TAG_ONOMATOPOEIC = 36;
  TAG_ABBREVIATION = 37;
}

// A grammatical coordinate. Every field is scalar: a table cell covering several cases
// ("nominative/accusative") becomes several Forms sharing one surface string, which
// keeps the shape flat and pivotable (R7.8).
message GrammaticalTags {
  // `case` is a C++ keyword, hence the prefix.
  Case grammatical_case = 1;
  Number number = 2;
  Gender gender = 3;
  Animacy animacy = 4;
  Person person = 5;
  Tense tense = 6;
  Mood mood = 7;
  Aspect aspect = 8;
  Voice voice = 9;
  Degree degree = 10;
  NonFinite non_finite = 11;
}

// ---------------------------------------------------------------------------
// Building blocks
// ---------------------------------------------------------------------------

// A template call kept verbatim (R4.2.1) — the escape hatch when our parsing is wrong.
message TemplateCall {
  string name = 1;
  repeated string args = 2;          // positional, in order
  repeated NamedArg named_args = 3;  // sorted by name; see the no-maps rule above
}

message NamedArg {
  string name = 1;
  string value = 2;
}

// A wikilink inside a plain-text string, so text stays greppable and still navigable
// (R7.6a). Offsets are Unicode codepoints, never bytes.
message LinkSpan {
  int32 start = 1;
  int32 end = 2;
  string target = 3;     // link target page title
  string display = 4;    // == text[start:end]
  string lang_code = 5;  // from {{l|pl|...}} / {{m|pl|...}}; empty for a bare [[...]]
}

// Points at one POS entry of one page. Stable across runs of the same dump.
message EntryRef {
  string title = 1;
  int32 etymology_index = 2;  // 0-based index into Word.etymology_groups
  int32 pos_index = 3;        // 0-based index into EtymologyGroup.entries
}

message Example {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_USAGE_EXAMPLE = 1;  // {{ux|pl|...}}
    TYPE_QUOTATION = 2;      // {{quote-book}}, {{RQ:...}}
  }
  Type type = 1;
  string text = 2;         // the Polish text, plain
  string translation = 3;  // the English translation, plain
  string literal = 4;      // literal gloss, when the template gives one
  repeated LinkSpan text_links = 5;
  Citation citation = 6;
  repeated TemplateCall templates = 7;
}

message Citation {
  string author = 1;
  string title = 2;
  string year = 3;
  string publisher = 4;
  string page = 5;
  string url = 6;
  string raw = 7;  // rendered citation line, for anything the fields miss
}

message Pronunciation {
  string ipa = 1;             // a single variant; repeat the message for more
  string syllabification = 2;
  string rhyme = 3;
  string audio_file = 4;      // Commons file name
  repeated string homophones = 5;
  repeated Tag tags = 6;      // e.g. TAG_MIDDLE_POLISH, TAG_DIALECTAL
  repeated string raw_tags = 7;   // unmapped accent qualifiers (Kresy, Poznań, ...)
  repeated TemplateCall templates = 8;
}

message Relation {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_SYNONYM = 1;
    TYPE_ANTONYM = 2;
    TYPE_HYPERNYM = 3;
    TYPE_HYPONYM = 4;
    TYPE_MERONYM = 5;
    TYPE_HOLONYM = 6;
    TYPE_COORDINATE = 7;
    TYPE_DERIVED = 8;
    TYPE_RELATED = 9;
    TYPE_ALTERNATIVE_FORM = 10;
    TYPE_SEE_ALSO = 11;
    TYPE_DIMINUTIVE = 12;
    TYPE_AUGMENTATIVE = 13;
    TYPE_ASPECT_PARTNER = 14;  // derived in P4 (R3.14)
    TYPE_COMPARATIVE_OF = 15;
  }
  Type type = 1;
  string term = 2;
  string gloss = 3;         // disambiguating gloss, when given
  string sense_id = 4;      // when the relation is scoped to a {{senseid}}
  repeated Tag tags = 5;
  repeated string raw_tags = 6;
  EntryRef target = 7;      // filled in by P4 where the term resolves
  bool derived_in_p4 = 8;   // true if inferred rather than stated by the article
}

message Descendant {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_INHERITED = 1;
    TYPE_BORROWED = 2;
    TYPE_LEARNED_BORROWING = 3;
    TYPE_CALQUE = 4;
  }
  Type type = 1;
  string lang_code = 2;
  string term = 3;
  string gloss = 4;
  repeated Descendant children = 5;  // descendant lists are trees
}

message EtymologyLink {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_INHERITED = 1;          // {{inh}}
    TYPE_BORROWED = 2;           // {{bor}}
    TYPE_LEARNED_BORROWING = 3;  // {{lbor}}
    TYPE_DERIVED = 4;            // {{der}}
    TYPE_CALQUE = 5;             // {{cal}}
    TYPE_COGNATE = 6;            // {{cog}}
    TYPE_AFFIX = 7;              // {{af}}, {{suf}}, {{pre}}
    TYPE_COMPOUND = 8;           // {{com}}
    TYPE_ONOMATOPOEIC = 9;
    TYPE_UNKNOWN_ORIGIN = 10;
  }
  Type type = 1;
  string lang_code = 2;  // source language ("sla-pro", "de", "la", ...)
  string term = 3;
  string gloss = 4;
  string roman = 5;      // romanization for non-Latin source terms
}

message Reference {
  string text = 1;  // rendered
  string url = 2;
  TemplateCall template = 3;
}

// What a non-lemma entry is a form of (R6.6). These entries are folded into the lemma
// and never emitted themselves (R3.13a); this message survives on the lemma's Form.
message FormOf {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_INFLECTION = 1;
    TYPE_ALTERNATIVE_SPELLING = 2;
    TYPE_ABBREVIATION = 3;
    TYPE_DIMINUTIVE = 4;
    TYPE_AUGMENTATIVE = 5;
    TYPE_COMPARATIVE = 6;
    TYPE_SUPERLATIVE = 7;
  }
  Type type = 1;
  string lemma = 2;  // the lemma's page title as written in the article
  EntryRef target = 3;
  GrammaticalTags tags = 4;
  repeated string raw_tags = 5;
}

// ---------------------------------------------------------------------------
// Entry content
// ---------------------------------------------------------------------------

message Sense {
  // Outer-to-inner gloss chain for sub-senses; plain text, links flattened (R7.6a).
  repeated string glosses = 1;
  string raw_gloss = 2;                 // as rendered, markup intact
  repeated LinkSpan gloss_links = 3;    // spans over the innermost gloss
  repeated Tag tags = 4;
  repeated string raw_tags = 5;         // unmapped {{lb}} labels
  repeated string topics = 6;           // topical categories (pl:Birds -> "Birds")
  repeated Example examples = 7;
  repeated Relation relations = 8;      // sense-scoped {{syn|pl|...}} etc.
  FormOf form_of = 9;
  string sense_id = 10;                 // {{senseid|pl|...}} anchor
  repeated Sense subsenses = 11;
  repeated string categories = 12;
}

// One inflected form. Flat and tagged rather than a fixed table (R7.8).
message Form {
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    SOURCE_DECLENSION_TABLE = 1;
    SOURCE_CONJUGATION_TABLE = 2;
    SOURCE_HEADWORD = 3;
    SOURCE_INFLECTION_TEMPLATE = 4;
    SOURCE_FORM_PAGE = 5;  // recovered from a folded form-of page (R3.13a)
  }
  string form = 1;
  GrammaticalTags tags = 2;
  repeated string raw_tags = 3;
  Source source = 4;
  bool has_own_page = 5;                     // a dedicated en.wikt page attests it
  repeated Pronunciation pronunciations = 6; // folded in from that page
  repeated Tag usage_tags = 7;               // e.g. TAG_ARCHAIC on one cell
}

message NounInfo {
  Gender gender = 1;
  Animacy animacy = 2;
  bool indeclinable = 3;
  bool plurale_tantum = 4;
  bool singulare_tantum = 5;
}

message VerbInfo {
  Aspect aspect = 1;
  repeated string aspect_partners = 2;  // as stated on the headword line
  bool reflexive = 3;                   // lemma takes się
  bool frequentative = 4;
  bool impersonal = 5;
}

message AdjectiveInfo {
  bool comparable = 1;
  string comparative = 2;
  string superlative = 3;
  string derived_adverb = 4;
}

message PosEntry {
  Pos pos = 1;
  string pos_heading = 2;  // the literal heading, when it does not map cleanly
  string headword = 3;     // as printed on the headword line
  repeated TemplateCall head_templates = 4;
  repeated Sense senses = 5;
  repeated Form forms = 6;
  repeated TemplateCall inflection_templates = 7;
  repeated Relation relations = 8;   // section-level (not sense-scoped)
  repeated Descendant descendants = 9;
  repeated Pronunciation pronunciations = 10;  // when given per POS
  string usage_notes = 11;
  repeated string categories = 12;
  repeated Reference references = 13;
  repeated Tag tags = 14;       // term-level {{tlb|pl|...}}
  repeated string raw_tags = 15;

  // POS-specific detail. Exactly one is set, matching `pos`.
  oneof detail {
    NounInfo noun = 16;
    VerbInfo verb = 17;
    AdjectiveInfo adjective = 18;
  }
}

// One `===Etymology N===` group, or the whole language section when the page has no
// numbered etymologies. Senses stay attached to their etymology (R5.1).
message EtymologyGroup {
  string etymology_text = 1;  // rendered, plain
  repeated LinkSpan etymology_links_spans = 2;
  repeated TemplateCall etymology_templates = 3;
  repeated EtymologyLink links = 4;
  repeated Pronunciation pronunciations = 5;
  repeated PosEntry entries = 6;
  repeated string categories = 7;
}

// ---------------------------------------------------------------------------
// Top level
// ---------------------------------------------------------------------------

// One Polish lemma page (R7.7a). Inflected-form pages are folded into their lemma and
// never appear here.
message Word {
  string title = 1;
  int64 page_id = 2;
  int64 revision_id = 3;
  string lang_code = 4;  // always "pl" in v1
  repeated EtymologyGroup etymology_groups = 5;
  repeated Pronunciation pronunciations = 6;  // page-level, above the etymologies
  repeated string categories = 7;
  repeated string anagrams = 8;
  repeated Reference further_reading = 9;
  repeated string see_also = 10;
}

// Corpus-level metadata, written to its own file rather than into the shards: it
// carries a generation timestamp, and the shards must stay byte-identical across runs
// of the same dump and code (G5).
message Corpus {
  string schema_version = 1;
  string dump_date = 2;
  string dump_sha1 = 3;
  bool dump_pinned = 4;          // false if --dump overrode the pin (R2.1a)
  string pipeline_git_revision = 5;
  string generated_at = 6;       // RFC 3339; the one non-deterministic field
  repeated string drop_labels = 7;  // what was excluded from this corpus (R6.6b)
  repeated string languages = 8;
  int64 word_count = 9;
  int64 shard_count = 10;
  string license = 11;           // "CC BY-SA 4.0", with attribution (R11.1)
  string attribution = 12;
}
