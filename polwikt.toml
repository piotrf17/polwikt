# polwikt pipeline configuration (R10.5). Wiktionary conventions and scope live here,
# not in Python; per-section tables (POS headings, labels, template policy) join this
# file's siblings under polwikt/data/ as the milestones that use them land.

[dump]
# The single pinned dump used by every dev run, golden test and stats.json comparison
# (R2.1a). Moving the pin is its own commit, reviewed
# alongside the stats.json diff it produces.
date = "20261001"  # -> enwiktionary-20261001-pages-articles.xml.bz2, 1,647,823,823 bytes
sha1 = "f9ed426c69c6b21d026613bd0f200c2aaa1145e9"  # from enwiktionary-20261001-sha1sums.txt
url_base = "https://dumps.wikimedia.org/enwiktionary"

[extract]
# L2 language headings whose ns-0 pages P1 keeps (R3.2).
languages = ["Polish"]
# Labels whose senses, entries, pronunciations, alt forms, tables and reference groups
# are dropped at extraction and counted (R6.6a-c).
drop_labels = ["Middle Polish"]
