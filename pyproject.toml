[project]
name = "polwikt"
version = "0.0.0"
description = "Polish lexical data from the English Wiktionary dump, as protobuf"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Git-pinned, not PyPI: the published releases are years stale and lack the
    # SQLite Wtp(db_path=...) API this project is built on (R10.2). Bump together with
    # wiktextract below — they break in lockstep.
    "wikitextprocessor @ git+https://github.com/tatuylonen/wikitextprocessor@04e9833735a502b288ede14be8989710a59c7cf2",
    "protobuf>=6.31,<8",
    "zstandard>=0.25,<0.26",
    "click>=8.2,<9",
    # P1 streams the dump with iterparse (R3.1); upstream depends on it too, but we
    # import it directly.
    "lxml>=6.1,<7",
]

[project.scripts]
polwikt = "polwikt.cli.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "mypy>=1.17,<2",
    "ruff>=0.12,<1",
    "grpcio-tools>=1.74,<2",
    "types-protobuf>=6.30,<7",
    # Cross-check oracle only (REQUIREMENTS §12.1); never imported by polwikt/.
    "wiktextract @ git+https://github.com/tatuylonen/wiktextract@32bce658cb4ab7f10c52e94b5191ce0b273d9c0f",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["polwikt"]

[tool.ruff]
target-version = "py313"
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
# IPA stress marks are data here, not a mistyped backtick.
allowed-confusables = ["ˈ", "ˌ"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["polwikt", "tests", "tools"]
exclude = ['_pb2\.pyi?$']

[[tool.mypy.overrides]]
module = ["wikitextprocessor.*", "wiktextract.*", "zstandard.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
